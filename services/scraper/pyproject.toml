[project]
name = "granted-scraper"
version = "0.1.0"
description = "Ingests Canadian government R&D funding (NSERC, Scale AI, …), classifies with local Ollama, embeds via Voyage AI, stores in Postgres+pgvector."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "selectolax>=0.3.21",
  "supabase>=2.10.0",
  "tenacity>=9.0.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
]

[project.scripts]
granted-scraper = "scraper.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]
